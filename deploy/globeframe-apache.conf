# GlobeFrame - Apache settings (installed to /etc/httpd/conf.d/globeframe.conf)
# Apache serves the website files and forwards /api/ requests to the Flask
# backend, which listens only on this server (127.0.0.1:5000).

ProxyRequests Off
ProxyPreserveHost On
ProxyPass        /api/ http://127.0.0.1:5000/api/ timeout=60
ProxyPassReverse /api/ http://127.0.0.1:5000/api/

# Uploads up to 12 MB (the backend limit is 10 MB per photo)
LimitRequestBody 12582912

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
</Directory>

<Directory "/var/www/html/photos">
    Options -Indexes -ExecCGI
    Header set Cache-Control "public, max-age=86400"
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
